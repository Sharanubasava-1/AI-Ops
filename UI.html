<!doctype html><html><head><base target="_top"><style>body{font:14px Arial;color:#0b1f3a;padding:14px}button{background:#0b1f3a;color:#fff;border:0;padding:9px;margin:4px;border-radius:4px}input,textarea{width:100%;box-sizing:border-box;margin:5px 0;padding:7px}.status{padding:8px;background:#f3f6fa}</style></head><body><h2>ALLO Operations</h2><div id="status" class="status">Select a pending row, then submit completion.</div><label>Ticket ID</label><input id="ticket"><label>WhatsApp/update reference</label><input id="reference"><label>Completion notes</label><textarea id="notes"></textarea><label>Proof link</label><input id="link"><button onclick="submit()">Submit completion</button><script>function submit(){var id=prompt('Enter the selected Cycle_ID');if(!id)return;google.script.run.withSuccessHandler(function(){document.getElementById('status').textContent='Completion recorded.'}).withFailureHandler(function(e){document.getElementById('status').textContent=e.message}).submitTaskCompletion(id,{Ticket_ID:ticket.value,WhatsApp_Update_Reference:reference.value,Completion_Notes:notes.value,Proof_Link:link.value});}</script></body></html>
